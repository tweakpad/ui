name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Builds, packs and installs the tarball into a consumer project (types, exports, tree-shaking).
      - run: npm run test:package
      # Per-component bundle sizes; fails if the package entry ships modules a component does not use.
      - run: node scripts/size-report.mjs
