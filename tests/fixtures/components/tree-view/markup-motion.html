<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tree view markup motion (issue 9)</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      body {
        margin: 0;
        padding: 2rem;
        background: var(--tp-background);

    <tp-tree-view id="tree" label="Files" default-expanded='["src"]' style="max-inline-size: 20rem">
