<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Popover placement regression</title>
    <style>
      body {
        margin: 0;
        font-family: var(--tp-font-sans);
        background: var(--tp-background);
        color: var(--tp-foreground);
      }
      main {
        padding: 32px;
      }
      #stage {
        position: absolute;
        left: 720px;
        top: 450px;
      }
      #wrapped {
        position: absolute;
        left: 32px;
        top: 220px;
        inline-size: 220px;
        margin: 0;
        line-height: 1.5;
      }
      #anchor {
        position: fixed;
        left: 750px;
        top: 400px;
        width: 80px;
        height: 40px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Popover placement regression</h1>
      <p>Public API checks run through Chrome DevTools MCP.</p>
    </main>
    <p id="wrapped">
      Harbor notes:
      <span id="wrapped-span">the evening ferry waits at the outer pier until the tide turns</span>.
    </p>
    <tp-popover id="multiline" label="Line note"><span slot="title">Line note</span></tp-popover>
    <div id="stage">
      <tp-popover id="subject" label="Placement settings">
        <tp-button slot="trigger" variant="outline">Placement settings</tp-button>
        <span slot="title">Placement settings</span>
        <span slot="description">Choose where this panel appears.</span>
        <tp-button slot="close">Done</tp-button>
      </tp-popover>
    </div>
    <script type="module" src="./fixture.js"></script>
  </body>
</html>
