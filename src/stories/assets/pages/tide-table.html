<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Harbour tide table</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f6f8fa, #1c1f24);
        --fg: light-dark(#1f2328, #e6e8eb);
        --muted: light-dark(#59636e, #9aa4b0);
        --line: light-dark(#d0d7de, #363b44);
        --high: light-dark(#0969da, #7cb3ff);
        --low: light-dark(#8250df, #c6a5ff);
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        padding: 16px 20px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
      }
      table {
        inline-size: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        padding: 6px 8px;
        text-align: start;
        border-block-end: 1px solid var(--line);
      }
      th {
        font-weight: 600;
        color: var(--muted);
      }
      td.high {
        color: var(--high);
      }
      td.low {
        color: var(--low);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Harbour tide table</h1>
      <p>Week 44 · heights above chart datum · updated Monday 06:00</p>
      <table>
        <thead>
          <tr>
            <th scope="col">Day</th>
            <th scope="col">Tide</th>
            <th scope="col">Time</th>
            <th scope="col">Height</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Mon</td>
            <td class="high">High</td>
            <td>05:48</td>
            <td>4.1 m</td>
          </tr>
          <tr>
            <td>Mon</td>
            <td class="low">Low</td>
            <td>12:03</td>
            <td>0.6 m</td>
          </tr>
          <tr>
            <td>Tue</td>
            <td class="high">High</td>
            <td>06:31</td>
            <td>4.3 m</td>
          </tr>
          <tr>
            <td>Tue</td>
            <td class="low">Low</td>
            <td>12:49</td>
            <td>0.4 m</td>
          </tr>
          <tr>
            <td>Wed</td>
            <td class="high">High</td>
            <td>07:14</td>
            <td>4.4 m</td>
          </tr>
          <tr>
            <td>Wed</td>
            <td class="low">Low</td>
            <td>13:36</td>
            <td>0.3 m</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
